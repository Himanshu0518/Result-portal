[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",          # only needed if you use async SQLAlchemy later
    "psycopg[binary]>=3.3.9",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",              # for FastAPI TestClient
]
