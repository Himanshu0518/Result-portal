# Alembic configuration for Result Portal
# Run all alembic commands from the server/ directory:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe change"
#   uv run alembic downgrade -1

[alembic]
script_location = %(here)s/migrations

# Revision filename template: timestamp + rev id + slug
# Makes files sort chronologically and are easier to audit.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

path_separator = os

# sqlalchemy.url is intentionally left blank here.
# The URL is read from the DATABASE_URL env var inside migrations/env.py,
# so secrets never live in this file.
sqlalchemy.url =


# ── Post-write hooks ──────────────────────────────────────────────────────────
# Uncomment to auto-format generated migration files once ruff is installed:
# [post_write_hooks]
# hooks = ruff_format
# ruff_format.type = exec
# ruff_format.executable = %(here)s/.venv/Scripts/ruff.exe
# ruff_format.options = format REVISION_SCRIPT_FILENAME


# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
